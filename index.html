<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#02040a">
  <title>Hyperspace Jump</title>

  <!-- Current stable A-Frame + matching aframe-extras release. -->
  <script src="https://aframe.io/releases/1.8.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/c-frame/aframe-extras@7.5.0/dist/aframe-extras.min.js"></script>
</head>

<body>
  <a-scene
    renderer="antialias: true; colorManagement: true; physicallyCorrectLights: true; precision: medium"
    background="color: #02040a"
    loading-screen="dotsColor: #dce9ff; backgroundColor: #02040a"
    device-orientation-permission-ui="enabled: true">

    <a-assets timeout="60000">
      <!-- Keep scene assets local to the repo to remove the old Glitch dependency. -->
      <img id="spaceBg" src="assets/img/spaceBackground.png" crossorigin="anonymous">
      <img id="planetTexture" src="assets/img/tat.png" crossorigin="anonymous">

      <!-- The optimization workflow generates rebel_fleet_optimized.glb. Until then,
           this source remains the animation-safe original asset. -->
      <a-asset-item
        id="fleet"
        src="assets/Fleet_Model/rebel_fleet_anim_corevetteview.gltf"
        response-type="arraybuffer">
      </a-asset-item>
    </a-assets>

    <!-- Camera + controllers share one rig so tracked hands stay aligned with the viewer. -->
    <a-entity id="viewerRig" position="-2.1085 5.90192 0">
      <a-camera
        id="camera"
        near="0.05"
        far="5000"
        wasd-controls="acceleration: 25"
        look-controls>
      </a-camera>
      <a-entity oculus-touch-controls="hand: left"></a-entity>
      <a-entity oculus-touch-controls="hand: right"></a-entity>
    </a-entity>

    <!-- Fleet -->
    <a-gltf-model
      id="fleetModel"
      src="#fleet"
      animation-mixer="clip: *"
      model-quality>
    </a-gltf-model>

    <!-- Space backdrop -->
    <a-sky
      id="space"
      src="#spaceBg"
      radius="3000"
      material="shader: flat"
      animation="property: rotation; to: -360 -360 -360; loop: true; dur: 2000000; easing: linear">
    </a-sky>

    <!-- A cheap three-light setup gives the ships and planet a cinematic key/fill
         without the cost of the previous long-range spot lights. -->
    <a-entity light="type: ambient; color: #93a5bd; intensity: 0.28"></a-entity>
    <a-entity
      light="type: directional; color: #fff0d6; intensity: 2.0"
      position="-4 3 -5">
    </a-entity>
    <a-entity
      light="type: directional; color: #6f8fc8; intensity: 0.45"
      position="5 -2 4">
    </a-entity>

    <!-- Planet surface: higher sphere tessellation, PBR material, improved texture filtering. -->
    <a-sphere
      id="planet"
      position="500 -100 0.06302"
      radius="200"
      segments-width="128"
      segments-height="64"
      material="src: #planetTexture; shader: standard; roughness: 0.9; metalness: 0.02"
      texture-quality
      animation="property: rotation; to: 0 360 0; loop: true; dur: 300000; easing: linear">
    </a-sphere>

    <!-- Separate atmosphere shell creates a soft Fresnel rim instead of baking the glow into the texture. -->
    <a-sphere
      id="planetAtmosphere"
      position="500 -100 0.06302"
      radius="207"
      segments-width="96"
      segments-height="48"
      atmosphere-glow="color: #9fc7ff; intensity: 0.72; power: 3.6">
    </a-sphere>

    <!-- Thin warm haze adds depth near the surface while remaining very cheap to render. -->
    <a-sphere
      id="planetHaze"
      position="500 -100 0.06302"
      radius="202"
      segments-width="64"
      segments-height="32"
      material="color: #d5b999; transparent: true; opacity: 0.035; side: back; depthWrite: false">
    </a-sphere>
  </a-scene>

  <script>
    // Improve texture sharpness at grazing angles while respecting each device's GPU limit.
    AFRAME.registerComponent('texture-quality', {
      init: function () {
        this.apply = this.apply.bind(this);
        this.el.addEventListener('materialtextureloaded', this.apply);
        this.el.addEventListener('object3dset', this.apply);
        this.apply();
      },

      apply: function () {
        const renderer = this.el.sceneEl && this.el.sceneEl.renderer;
        const mesh = this.el.getObject3D('mesh');
        if (!renderer || !mesh) return;

        const anisotropy = Math.min(renderer.capabilities.getMaxAnisotropy(), 8);
        mesh.traverse((node) => {
          if (!node.isMesh || !node.material) return;
          const materials = Array.isArray(node.material) ? node.material : [node.material];
          materials.forEach((material) => {
            ['map', 'normalMap', 'roughnessMap', 'metalnessMap', 'emissiveMap'].forEach((slot) => {
              if (material[slot]) {
                material[slot].anisotropy = anisotropy;
                material[slot].needsUpdate = true;
              }
            });
          });
        });
      }
    });

    // Apply safe runtime tuning once the animated fleet is loaded.
    AFRAME.registerComponent('model-quality', {
      init: function () {
        this.el.addEventListener('model-loaded', (event) => {
          const renderer = this.el.sceneEl.renderer;
          const anisotropy = Math.min(renderer.capabilities.getMaxAnisotropy(), 8);

          event.detail.model.traverse((node) => {
            node.frustumCulled = true;
            if (!node.isMesh || !node.material) return;

            // There are no realtime shadows in this scene, so avoid their GPU overhead.
            node.castShadow = false;
            node.receiveShadow = false;

            const materials = Array.isArray(node.material) ? node.material : [node.material];
            materials.forEach((material) => {
              ['map', 'normalMap', 'roughnessMap', 'metalnessMap', 'emissiveMap'].forEach((slot) => {
                if (material[slot]) {
                  material[slot].anisotropy = anisotropy;
                  material[slot].needsUpdate = true;
                }
              });
              material.needsUpdate = true;
            });
          });
        });
      }
    });

    // Lightweight atmosphere shader: visual depth without a large atmosphere texture.
    AFRAME.registerComponent('atmosphere-glow', {
      schema: {
        color: { type: 'color', default: '#9fc7ff' },
        intensity: { type: 'number', default: 0.7 },
        power: { type: 'number', default: 3.5 }
      },

      init: function () {
        this.applyMaterial = this.applyMaterial.bind(this);
        this.el.addEventListener('object3dset', this.applyMaterial);
        this.applyMaterial();
      },

      applyMaterial: function () {
        const mesh = this.el.getObject3D('mesh');
        if (!mesh) return;

        mesh.material = new THREE.ShaderMaterial({
          uniforms: {
            glowColor: { value: new THREE.Color(this.data.color) },
            intensity: { value: this.data.intensity },
            power: { value: this.data.power }
          },
          vertexShader: `
            varying vec3 vNormal;
            varying vec3 vWorldPosition;

            void main() {
              vNormal = normalize(mat3(modelMatrix) * normal);
              vec4 worldPosition = modelMatrix * vec4(position, 1.0);
              vWorldPosition = worldPosition.xyz;
              gl_Position = projectionMatrix * viewMatrix * worldPosition;
            }
          `,
          fragmentShader: `
            uniform vec3 glowColor;
            uniform float intensity;
            uniform float power;
            varying vec3 vNormal;
            varying vec3 vWorldPosition;

            void main() {
              vec3 viewDirection = normalize(cameraPosition - vWorldPosition);
              float rim = pow(1.0 - abs(dot(normalize(vNormal), viewDirection)), power);
              gl_FragColor = vec4(glowColor, rim * intensity);
            }
          `,
          side: THREE.BackSide,
          blending: THREE.AdditiveBlending,
          transparent: true,
          depthWrite: false
        });
      }
    });
  </script>
</body>
</html>
