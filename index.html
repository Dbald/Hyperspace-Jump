<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#02040a">
  <meta name="description" content="Double hyperspace jump to evade the Empire — a WebXR fleet sequence built with A-Frame.">
  <title>Hyperspace Jump</title>

  <link rel="preload" as="fetch" href="assets/Fleet_Model/rebel_fleet_optimized.glb" crossorigin="anonymous">

  <script src="https://aframe.io/releases/1.8.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/c-frame/aframe-extras@7.7.0/dist/aframe-extras.min.js"></script>

  <script src="js/sun.js"></script>
  <script src="js/planet.js"></script>
  <script src="js/starfield.js"></script>
  <script src="js/hyperspace.js"></script>
  <script src="js/cockpit.js"></script>
  <script src="js/model-quality.js"></script>
</head>

<body>
  <a-scene
    renderer="antialias: true; colorManagement: true; precision: medium; foveationLevel: 1; logarithmicDepthBuffer: true; toneMapping: ACESFilmic; exposure: 1.15; anisotropy: 8"
    gltf-model="dracoDecoderPath: assets/vendor/draco/"
    sun="direction: -0.36 0.30 -0.88; color: #fff4e0; intensity: 2.6; ambientColor: #5c7091; ambientIntensity: 0.32"
    background="color: #02040a"
    loading-screen="dotsColor: #dce9ff; backgroundColor: #02040a"
    device-orientation-permission-ui="enabled: true">

    <a-assets timeout="60000">
      <img id="spaceBg" src="assets/generated/space_sky.webp" crossorigin="anonymous">
      <img id="planetColor" src="assets/generated/planet_color.webp" crossorigin="anonymous">
      <img id="planetNormal" src="assets/generated/planet_normal.webp" crossorigin="anonymous">
      <img id="planetSurface" src="assets/generated/planet_surface.webp" crossorigin="anonymous">
      <img id="planetClouds" src="assets/generated/planet_clouds.webp" crossorigin="anonymous">
      <a-asset-item id="fleet" src="assets/Fleet_Model/rebel_fleet_optimized.glb"></a-asset-item>
    </a-assets>

    <a-entity
      id="viewerRig"
      position="-2.1085 5.90192 0"
      cockpit="model: #fleetModel; tune: true">
      <a-camera
        id="camera"
        near="0.05"
        far="200000"
        look-controls>
      </a-camera>
      <a-entity meta-touch-controls="hand: left"></a-entity>
      <a-entity meta-touch-controls="hand: right"></a-entity>

      <!-- Parented to the rig so the tunnel travels with the viewer. -->
      <a-entity id="jump" hyperspace="starfield: #stars"></a-entity>
    </a-entity>

    <a-gltf-model
      id="fleetModel"
      src="#fleet"
      animation-mixer="clip: *"
      model-quality>
    </a-gltf-model>

    <a-sky
      id="space"
      src="#spaceBg"
      radius="3000"
      material="shader: flat"
      animation="property: rotation; to: -360 -360 -360; loop: true; dur: 2000000; easing: linear">
    </a-sky>

    <a-entity id="stars" starfield="count: 5000; radius: 2400; brightness: 1.05"></a-entity>

    <a-entity light="type: ambient; color: #5c7091; intensity: 0.32"></a-entity>
    <a-entity
      light="type: directional; color: #fff4e0; intensity: 2.6"
      sun-light="distance: 40">
    </a-entity>
    <a-entity
      light="type: directional; color: #6f8fc8; intensity: 0.85"
      sun-light="distance: 40; opposite: true">
    </a-entity>

    <a-entity
      id="planet"
      position="500 -100 0.06302"
      planet="
        radius: 200;
        colorMap: #planetColor;
        normalMap: #planetNormal;
        surfaceMap: #planetSurface;
        cloudMap: #planetClouds;
        dayLength: 300;
        cloudDayLength: 210;
        skyColor: #8fc0ff;
        twilightColor: #ff9a52;
        nightColor: #141d31">
    </a-entity>
  </a-scene>
</body>
</html>
