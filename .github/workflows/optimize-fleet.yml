name: Optimize fleet model

on:
  push:
    branches:
      - upgrade/aframe-1.8-visual-performance
    paths-ignore:
      - assets/Fleet_Model/rebel_fleet_optimized.glb

permissions:
  contents: write

jobs:
  optimize:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install optimizer
        run: npm install --no-package-lock

      - name: Optimize animated fleet
        run: npm run optimize:model

      - name: Remove temporary files
        run: rm -f .tmp-fleet-1.glb .tmp-fleet-2.glb .tmp-fleet-3.glb

      - name: Commit optimized GLB
        shell: bash
        run: |
          if [ -z "$(git status --porcelain -- assets/Fleet_Model/rebel_fleet_optimized.glb)" ]; then
            echo "Optimized model is already current."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/Fleet_Model/rebel_fleet_optimized.glb
          git commit -m "Optimize fleet model for WebXR"
          git push origin HEAD:upgrade/aframe-1.8-visual-performance
